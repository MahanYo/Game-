<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>GameHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0f1a; --card:#151b2e; --card2:#1c2340; --line:#232b47;
  --a1:#6366f1; --a2:#a855f7; --a3:#06b6d4; --ok:#10b981; --no:#ef4444;
  --tx:#e2e8f0; --mut:#7c88a8; --grad:linear-gradient(135deg,#6366f1,#a855f7);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx)}
body{overscroll-behavior:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(99,102,241,.15),transparent 60%),var(--bg);position:relative}

/* ===== Header ===== */
#header{padding:14px 18px 10px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:16px;color:#fff;overflow:hidden;flex-shrink:0;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.hinfo{flex:1;min-width:0}
.hinfo .hi{font-size:11px;color:var(--mut);margin-bottom:2px}
.hinfo .hn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcoin{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:7px 11px;border-radius:12px;font-size:13px;font-weight:700;color:#fbbf24}
.hcoin svg{width:16px;height:16px}

/* ===== Main ===== */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 96px;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar{display:none}

/* ===== Bottom Nav ===== */
#nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;
  background:rgba(21,27,46,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:50}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
  color:var(--mut);font-size:10px;font-weight:600;cursor:pointer;padding:4px;transition:.2s;font-family:inherit}
.navb svg{width:22px;height:22px;transition:.2s}
.navb.on{color:var(--a1)}
.navb.on svg{transform:translateY(-2px);filter:drop-shadow(0 4px 10px rgba(99,102,241,.5))}

/* ===== Cards / Buttons ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{background:var(--grad);border:0;color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;
  font-size:14px;cursor:pointer;width:100%;transition:.15s;font-family:inherit;display:flex;
  align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}

/* ===== Home ===== */
.hero{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.15));
  border:1px solid rgba(99,102,241,.3);border-radius:22px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:-40%;left:-20%;width:200px;height:200px;
  background:radial-gradient(circle,rgba(168,85,247,.4),transparent 70%);filter:blur(20px)}
.hero h2{font-size:20px;margin-bottom:6px;position:relative}
.hero p{font-size:13px;color:var(--mut);position:relative;line-height:1.6}
.hero .stats{display:flex;gap:20px;margin-top:14px;position:relative}
.hero .stat{display:flex;flex-direction:column;gap:2px}
.hero .stat b{font-size:18px;background:linear-gradient(135deg,#fff,#c7d2fe);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.hero .stat span{font-size:10px;color:var(--mut);font-weight:600}

.sect-title{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-size:15px;font-weight:700}
.sect-title svg{width:18px;height:18px;color:var(--a2)}

.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  cursor:pointer;transition:.2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.gcard:active{transform:scale(.96);border-color:var(--a1)}
.gcard::before{content:"";position:absolute;top:-40px;left:-40px;width:100px;height:100px;
  background:var(--gc,var(--a1));opacity:.15;border-radius:50%;filter:blur(20px);transition:.3s}
.gcard:active::before{opacity:.35;transform:scale(1.5)}
.gicon{width:44px;height:44px;border-radius:14px;background:var(--gc,var(--a1));display:flex;
  align-items:center;justify-content:center;color:#fff;position:relative;z-index:1;
  box-shadow:0 8px 20px -6px var(--gc,var(--a1))}
.gicon svg{width:24px;height:24px}
.gname{font-size:13px;font-weight:700;position:relative;z-index:1;line-height:1.4}
.gbest{font-size:10px;color:var(--mut);font-weight:600;position:relative;z-index:1;
  display:flex;align-items:center;gap:4px}
.gbest svg{width:12px;height:12px;color:#fbbf24}

/* ===== Game View ===== */
#gview{position:absolute;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;
  max-width:520px;margin:0 auto;left:0;right:0}
#gview.open{display:flex}
.ghead{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;flex-shrink:0}
.backbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--tx);cursor:pointer}
.backbtn svg{width:20px;height:20px}
.ghead h3{flex:1;font-size:16px}
.gscore{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.gscore svg{width:14px;height:14px;color:#fbbf24}
.gbody{flex:1;overflow-y:auto;padding:0 18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gbody::-webkit-scrollbar{display:none}

/* ===== Memory Game ===== */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px;margin:0 auto}
.mcard{aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;
  transition:.3s;position:relative;transform-style:preserve-3d}
.mcard .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;border-radius:14px}
.mcard .back{background:linear-gradient(135deg,#1c2340,#2a3358);color:var(--mut)}
.mcard .back svg{width:24px;height:24px}
.mcard .front{background:var(--grad);transform:rotateY(180deg);color:#fff}
.mcard .front svg{width:32px;height:32px}
.mcard.flip{transform:rotateY(180deg)}
.mcard.done{opacity:.4;pointer-events:none}

/* ===== 2048 ===== */
.g2048{background:var(--card);border-radius:18px;padding:10px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px}
.tile{aspect-ratio:1;border-radius:12px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:22px;transition:.15s;color:#fff}
.t2{background:#2e3652;color:#c7d2fe}.t4{background:#3a4470}.t8{background:#6366f1}
.t16{background:#7c3aed}.t32{background:#a855f7}.t64{background:#d946ef}
.t128{background:#ec4899;font-size:20px}.t256{background:#f43f5e;font-size:20px}
.t512{background:#f97316;font-size:20px}.t1024{background:#f59e0b;font-size:16px}
.t2048{background:linear-gradient(135deg,#fbbf24,#f59e0b);font-size:16px;
  box-shadow:0 0 20px rgba(251,191,36,.6)}

/* ===== Reaction ===== */
.reactBox{width:100%;max-width:340px;aspect-ratio:1;border-radius:22px;background:var(--card);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;cursor:pointer;transition:.2s;text-align:center;padding:20px}
.reactBox.ready{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#ef4444}
.reactBox.go{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981;
  animation:pulse .4s}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.reactBox svg{width:56px;height:56px;opacity:.9}
.reactBox h4{font-size:18px;font-weight:800}
.reactBox p{font-size:13px;opacity:.85;line-height:1.6}

/* ===== Whack ===== */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px}
.hole{aspect-ratio:1;border-radius:50%;background:var(--card2);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;
  transition:.1s}
.hole::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 100%,rgba(99,102,241,.3),transparent 70%)}
.mole{width:70%;height:70%;border-radius:50%;background:var(--grad);transform:scale(0);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
.hole.up .mole{transform:scale(1)}
.hole.hit .mole{background:linear-gradient(135deg,#ef4444,#f59e0b)}

/* ===== Snake ===== */
.snake-wrap{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:18px;
  background:var(--card);border:1px solid var(--line);overflow:hidden}
#snakeCanvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);
  gap:6px;margin-top:16px;justify-content:center}
.dbtn{background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--tx);
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:.1s}
.dbtn:active{background:var(--a1);border-color:var(--a1)}
.dbtn svg{width:22px;height:22px}
.dpad .sp{visibility:hidden}

/* ===== Tic Tac Toe ===== */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px}
.ttc{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.ttc:active{transform:scale(.95)}
.ttc svg{width:60%;height:60%}
.ttc.x svg{color:var(--a1)}
.ttc.o svg{color:var(--a2)}
.ttc.win{background:rgba(16,185,129,.15);border-color:var(--ok)}

/* ===== Profile ===== */
.pcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:22px;padding:24px 20px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:180px;height:180px;background:radial-gradient(circle,rgba(99,102,241,.4),transparent 70%);filter:blur(30px)}
.pavatar{width:88px;height:88px;border-radius:28px;margin:0 auto 14px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;
  overflow:hidden;position:relative;border:3px solid rgba(255,255,255,.1)}
.pavatar img{width:100%;height:100%;object-fit:cover}
.pcard h3{font-size:19px;margin-bottom:4px;position:relative}
.pcard .un{font-size:13px;color:var(--mut);margin-bottom:16px;position:relative}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.pstat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px 8px}
.pstat b{display:block;font-size:20px;background:linear-gradient(135deg,#fff,#c7d2fe);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px}
.pstat span{font-size:10px;color:var(--mut);font-weight:600}

.score-list{display:flex;flex-direction:column;gap:8px}
.sitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px}
.sitem .sicon{width:40px;height:40px;border-radius:12px;background:var(--gc,var(--a1));color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sitem .sicon svg{width:22px;height:22px}
.sitem .sinfo{flex:1;min-width:0}
.sitem .sinfo b{font-size:13px;display:block;margin-bottom:2px}
.sitem .sinfo span{font-size:11px;color:var(--mut)}
.sitem .sval{font-size:16px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.empty{text-align:center;padding:30px 20px;color:var(--mut);font-size:13px}
.empty svg{width:48px;height:48px;opacity:.3;margin-bottom:12px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:12px 20px;
  border-radius:14px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:200;
  pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Modal ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:150;
  display:none;align-items:center;justify-content:center;padding:24px}
#modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;
  width:100%;max-width:340px;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.mbox .mico{width:70px;height:70px;border-radius:24px;background:var(--grad);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;color:#fff}
.mbox .mico svg{width:38px;height:38px}
.mbox h3{font-size:20px;margin-bottom:8px}
.mbox p{font-size:13px;color:var(--mut);margin-bottom:20px;line-height:1.6}
.mbox .mbtns{display:flex;gap:10px}

.fade{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="main"></main>
  <nav id="nav"></nav>

  <div id="gview">
    <div class="ghead">
      <div class="backbtn" onclick="closeGame()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <h3 id="gtitle"></h3>
      <div class="gscore" id="gscore"></div>
    </div>
    <div class="gbody" id="gbody"></div>
  </div>
</div>

<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox" id="mbox"></div>
</div>

<script>
/* ============ Telegram ============ */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0b0f1a'); tg.setBackgroundColor?.('#0b0f1a'); tg.disableVerticalSwipes?.(); }

/* ============ Icons (SVG) ============ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  game:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 1012 0V2z"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5a3 3 0 00-3-1.5c-1.5 0-3 .9-3 2.5s1.5 2 3 2.5 3 1 3 2.5-1.5 2.5-3 2.5a3 3 0 01-3-1.5"/></svg>',
  brain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0112 4.5v15a2.5 2.5 0 01-4.96.44 2.5 2.5 0 01-2.96-3.08 3 3 0 01-.34-5.58 2.5 2.5 0 011.32-4.24 2.5 2.5 0 011.98-3A2.5 2.5 0 019.5 2z"/><path d="M14.5 2A2.5 2.5 0 0012 4.5v15a2.5 2.5 0 004.96.44 2.5 2.5 0 002.96-3.08 3 3 0 00.34-5.58 2.5 2.5 0 00-1.32-4.24 2.5 2.5 0 00-1.98-3A2.5 2.5 0 0014.5 2z"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  snake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c0-3 2-5 5-5h3c3 0 5 2 5 5s-2 5-5 5H8c-3 0-5-2-5-5z"/><circle cx="17" cy="9" r="1" fill="currentColor"/><path d="M20 12v3a3 3 0 003 3"/></svg>',
  xo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  xoO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="8"/></svg>',
  xoX:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',

/* ============ GAME 1: Memory ============ */
function startMemory(){
  const ICONS = [I.brain,I.zap,I.target,I.snake,I.grid,I.medal,I.coin,I.star];
  const deck = [...ICONS,...ICONS].sort(()=>Math.random()-.5);
  let flipped=[], matched=0, moves=0, lock=false;
  const body = document.getElementById('gbody');
  body.innerHTML = `<div class="mgrid" id="mgrid">${deck.map((ic,i)=>`
    <div class="mcard" data-i="${i}">
      <div class="face back">${I.grid}</div>
      <div class="face front">${ic}</div>
    </div>`).join('')}</div>`;
  setGameScore(0);
  const grid = document.getElementById('mgrid');
  grid.onclick = e=>{
    const c = e.target.closest('.mcard'); if(!c||lock) return;
    const i = +c.dataset.i;
    if(c.classList.contains('flip')||c.classList.contains('done')) return;
    c.classList.add('flip'); flipped.push({c,i});
    tgHaptic('light');
    if(flipped.length===2){
      lock=true; moves++;
      setGameScore(moves);
      const [a,b] = flipped;
      if(deck[a.i]===deck[b.i]){
        setTimeout(()=>{ a.c.classList.add('done'); b.c.classList.add('done');
          matched++; flipped=[]; lock=false; tgNotify('success');
          if(matched===ICONS.length){
            const newRec = setScore('memory', Math.max(0, 100 - moves*3));
            setTimeout(()=>{
              tgNotify('success');
              openModal({icon:I.trophy,title:'آفرین! 🎉',
                desc:`در ${moves} حرکت برنده شدی!${newRec?'\nرکورد جدید ثبت شد!':''}`,
                btns:[{label:'دوباره',action:'closeModal();startGame(\'memory\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]});
            },400);
          }
        },300);
      } else {
        setTimeout(()=>{ a.c.classList.remove('flip'); b.c.classList.remove('flip');
          flipped=[]; lock=false; tgHaptic('soft'); },700);
      }
    }
  };
  State.gState = {};
}

/* ============ GAME 2: 2048 ============ */
function start2048(){
  let grid = Array(16).fill(0), score=0, over=false;
  const body = document.getElementById('gbody');
  body.innerHTML = `<div class="g2048" id="g2048"></div>
    <button class="btn ghost" style="margin-top:16px;max-width:340px" onclick="startGame('g2048')">${I.refresh} شروع دوباره</button>`;
  setGameScore(0);
  const el = document.getElementById('g2048');
  function addTile(){
    const empty = grid.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empty.length) return;
    const i = empty[Math.floor(Math.random()*empty.length)];
    grid[i] = Math.random()<.9?2:4;
  }
  function render(){
    el.innerHTML = grid.map(v=>`<div class="tile ${v?'t'+v:''}">${v||''}</div>`).join('');
    setGameScore(score);
  }
  function move(dir){ // 0=up,1=right,2=down,3=left
    if(over) return;
    const before = grid.join(',');
    for(let k=0;k<4;k++){
      const line = [];
      for(let i=0;i<4;i++){
        let r,c;
        if(dir===0){r=i;c=k} else if(dir===1){r=k;c=3-i}
        else if(dir===2){r=3-i;c=k} else {r=k;c=i}
        line.push(grid[r*4+c]);
      }
      const filtered = line.filter(v=>v);
      const merged = [];
      for(let i=0;i<filtered.length;i++){
        if(filtered[i]===filtered[i+1]){ merged.push(filtered[i]*2); score+=filtered[i]*2; i++; }
        else merged.push(filtered[i]);
      }
      while(merged.length<4) merged.push(0);
      for(let i=0;i<4;i++){
        let r,c;
        if(dir===0){r=i;c=k} else if(dir===1){r=k;c=3-i}
        else if(dir===2){r=3-i;c=k} else {r=k;c=i}
        grid[r*4+c] = merged[i];
      }
    }
    if(grid.join(',')!==before){ addTile(); render(); tgHaptic('light'); check(); }
  }
  function check(){
    if(grid.includes(2048)){ over=true; tgNotify('success');
      setScore('g2048',score);
      setTimeout(()=>openModal({icon:I.trophy,title:'بردی! 🏆',
        desc:`امتیاز نهایی: ${score}`,
        btns:[{label:'دوباره',action:'closeModal();startGame(\'g2048\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]}),300);
      return;
    }
    if(grid.every(v=>v) && !canMove()){ over=true; tgNotify('warning');
      setScore('g2048',score);
      setTimeout(()=>openModal({icon:I.medal,title:'بازی تموم شد',
        desc:`امتیاز نهایی: ${score}`,
        btns:[{label:'دوباره',action:'closeModal();startGame(\'g2048\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]}),300);
    } else setScore('g2048',score);
  }
  function canMove(){
    for(let i=0;i<16;i++){
      if(!grid[i]) return true;
      const r=Math.floor(i/4), c=i%4;
      if(c<3 && grid[i]===grid[i+1]) return true;
      if(r<3 && grid[i]===grid[i+4]) return true;
    }
    return false;
  }
  // keyboard
  function onKey(e){
    const map = {ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
    if(map[e.key]!==undefined){ e.preventDefault(); move(map[e.key]); }
  }
  document.addEventListener('keydown', onKey);
  // touch swipe
  let sx=0,sy=0;
  function ts(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }
  function te(e){
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:3);
    else move(dy>0?2:0);
  }
  el.addEventListener('touchstart', ts, {passive:true});
  el.addEventListener('touchend', te, {passive:true});
  // init
  addTile(); addTile(); render();
  State.gState = { destroy(){ document.removeEventListener('keydown', onKey); } };
}

/* ============ GAME 3: Reaction ============ */
function startReact(){
  let state='idle', start=0, times=[], best=null;
  const body = document.getElementById('gbody');
  function render(){
    const cfg = {
      idle:{cls:'',icon:I.zap,h:'آماده‌ای؟',p:'روی دکمه بزن تا شروع بشه'},
      wait:{cls:'ready',icon:I.target,h:'صبر کن...',p:'منتظر رنگ سبز باش'},
      go:{cls:'go',icon:I.zap,h:'بزن!',p:'هرچی سریع‌تر!'},
      done:{cls:'',icon:I.medal,h:`${best} ms`,p:'دوباره تلاش کن تا بهتر بشی'}
    }[state];
    body.innerHTML = `<div class="reactBox ${cfg.cls}" id="reactBox">
      ${cfg.icon}<h4>${cfg.h}</h4><p>${cfg.p}</p>
      ${times.length?`<p style="margin-top:8px;font-size:11px">آخرین‌ها: ${times.slice(-3).join(', ')} ms</p>`:''}
    </div>`;
    document.getElementById('reactBox').onclick = click;
  }
  let timer;
  function click(){
    tgHaptic('medium');
    if(state==='idle'||state==='done'){
      state='wait'; render();
      const delay = 1500 + Math.random()*2500;
      timer = setTimeout(()=>{ state='go'; start=performance.now(); render(); tgHaptic('heavy'); }, delay);
    } else if(state==='wait'){
      clearTimeout(timer); state='done'; render(); toast('زود زدی! 🙈');
    } else if(state==='go'){
      const t = Math.round(performance.now()-start);
      times.push(t);
      best = best===null?t:Math.min(best,t);
      state='done'; render();
      setScore('react', best);
      tgNotify('success');
    }
  }
  render();
  State.gState = { destroy(){ clearTimeout(timer); } };
}

}

/* ============ GAME 5: Snake ============ */
function startSnake(){
  const body = document.getElementById('gbody');
  body.innerHTML = `
    <div class="snake-wrap"><canvas id="snakeCanvas" width="320" height="320"></canvas></div>
    <div class="dpad">
      <div class="sp"></div>
      <button class="dbtn" data-d="0">${I.up}</button>
      <div class="sp"></div>
      <button class="dbtn" data-d="3">${I.left}</button>
      <div class="sp"></div>
      <button class="dbtn" data-d="1">${I.right}</button>
      <div class="sp"></div>
      <button class="dbtn" data-d="2">${I.down}</button>
      <div class="sp"></div>
    </div>`;
  const cv = document.getElementById('snakeCanvas');
  const ctx = cv.getContext('2d');
  const N = 16, S = cv.width/N;
  let snake = [{x:8,y:8}], dir = 1, food = rand(), score = 0, dead = false, tick;
  function rand(){ let p; do{ p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; } while(snake.some(s=>s.x===p.x&&s.y===p.y)); return p; }
  function draw(){
    ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0,0,cv.width,cv.height);
    // grid
    ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
    for(let i=0;i<=N;i++){ ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*S); ctx.lineTo(cv.width,i*S); ctx.stroke(); }
    // food
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-2, 0, Math.PI*2); ctx.fill();
    // snake
    snake.forEach((s,i)=>{
      const grd = ctx.createLinearGradient(s.x*S,s.y*S,(s.x+1)*S,(s.y+1)*S);
      if(i===0){ grd.addColorStop(0,'#a855f7'); grd.addColorStop(1,'#6366f1'); }
      else { grd.addColorStop(0,'#6366f1'); grd.addColorStop(1,'#3b82f6'); }
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.roundRect(s.x*S+1, s.y*S+1, S-2, S-2, 5); ctx.fill();
    });
    setGameScore(score);
  }
  function step(){
    if(dead) return;
    const h = {...snake[0]};
    if(dir===0) h.y--; else if(dir===1) h.x++; else if(dir===2) h.y++; else h.x--;
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
      dead = true; clearInterval(tick); tgNotify('error');
      const newRec = setScore('snake', score);
      openModal({icon:I.medal,title:'باختی!',
        desc:`امتیاز: ${score}${newRec?'\nرکورد جدید! 🎉':''}`,
        btns:[{label:'دوباره',action:'closeModal();startGame(\'snake\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]});
      return;
    }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){ score++; food = rand(); tgHaptic('light'); }
    else snake.pop();
    draw();
  }
  function setDir(d){
    if((dir===0&&d===2)||(dir===2&&d===0)||(dir===1&&d===3)||(dir===3&&d===1)) return;
    dir = d; tgHaptic('light');
  }
  document.querySelectorAll('.dbtn').forEach(b=>{ b.onclick = ()=>setDir(+b.dataset.d); });
  function onKey(e){
    const m = {ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
    if(m[e.key]!==undefined){ e.preventDefault(); setDir(m[e.key]); }
  }
  document.addEventListener('keydown', onKey);
  // swipe
  let sx=0,sy=0;
  cv.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  cv.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:3); else setDir(dy>0?2:0);
  },{passive:true});
  draw();
  tick = setInterval(step, 160);
  State.gState = { destroy(){ clearInterval(tick); document.removeEventListener('keydown', onKey); } };
}

/* ============ GAME 6: Tic Tac Toe ============ */
function startTTT(){
  let board = Array(9).fill(''), done = false, wins = 0;
  const body = document.getElementById('gbody');
  body.innerHTML = `<div class="ttt" id="ttt">${Array(9).fill(0).map((_,i)=>`<div class="ttc" data-i="${i}"></div>`).join('')}</div>
    <button class="btn ghost" style="margin-top:18px;max-width:320px" onclick="startGame('ttt')">${I.refresh} بازی جدید</button>`;
  setGameScore(wins);
  const el = document.getElementById('ttt');
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function render(){
    el.querySelectorAll('.ttc').forEach((c,i)=>{
      c.className = 'ttc' + (board[i]?' '+board[i]:'');
      c.innerHTML = board[i]==='x'?I.xoX:board[i]==='o'?I.xoO:'';
    });
    setGameScore(wins);
  }
  function winner(b){
    for(const L of LINES){ const [a,c,d]=L; if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return {p:b[a],line:L}; }
    return b.every(v=>v)?{p:'draw'}:null;
  }
  function aiMove(){
    const empty = board.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empty.length) return;
    // try win
    for(const i of empty){ const b=[...board]; b[i]='o'; if(winner(b)?.p==='o'){ board[i]='o'; return; } }
    // block
    for(const i of empty){ const b=[...board]; b[i]='x'; if(winner(b)?.p==='x'){ board[i]='o'; return; } }
    // center
    if(!board[4]){ board[4]='o'; return; }
    // corner
    const corners = [0,2,6,8].filter(i=>!board[i]);
    if(corners.length){ board[corners[Math.floor(Math.random()*corners.length)]]='o'; return; }
    board[empty[Math.floor(Math.random()*empty.length)]]='o';
  }
  el.onclick = e=>{
    const c = e.target.closest('.ttc'); if(!c||done) return;
    const i = +c.dataset.i; if(board[i]) return;
    board[i]='x'; tgHaptic('light'); render();
    let w = winner(board);
    if(w) return end(w);
    setTimeout(()=>{
      aiMove(); render(); tgHaptic('light');
      w = winner(board); if(w) end(w);
    }, 350);
  };
  function end(w){
    done = true;
    if(w.p==='x'){ wins++; tgNotify('success');
      openModal({icon:I.trophy,title:'بردی! 🎉',desc:'تو از هوش مصنوعی بردی!',
        btns:[{label:'دوباره',action:'closeModal();startGame(\'ttt\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]});
    } else if(w.p==='o'){ tgNotify('error');
      openModal({icon:I.medal,title:'باختی!',desc:'هوش مصنوعی برد. دوباره تلاش کن!',
        btns:[{label:'دوباره',action:'closeModal();startGame(\'ttt\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]});
    } else { tgHaptic('medium');
      openModal({icon:I.target,title:'مساوی!',desc:'مساوی شدی با هوش مصنوعی',
        btns:[{label:'دوباره',action:'closeModal();startGame(\'ttt\')'},{label:'خروج',ghost:1,action:'closeModal();closeGame()'}]});
    }
  }
  render();
  State.gState = {};
}

/* ============ Init ============ */
function initUser(){
  const u = tg?.initDataUnsafe?.user;
  if(u){
    State.user = {
      id: u.id,
      name: [u.first_name, u.last_name].filter(Boolean).join(' ') || 'کاربر',
      username: u.username||'',
      photo: u.photo_url||null
    };
  }
}

window.addEventListener('load', ()=>{
  initUser();
  go('home');
});
