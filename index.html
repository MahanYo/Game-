<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GameHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header id="header"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="gview">
    <div class="ghead">
      <div class="backbtn" id="gback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <h3 id="gtitle"></h3>
      <div class="gscore" id="gscore"></div>
    </div>
    <div class="gbody" id="gbody"></div>
  </div>
</div>
<div id="reg" class="reg"></div>
<div id="toast"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="standaloneOverlay">
  <div class="standalone-bar">
    <button id="standaloneClose" aria-label="بستن">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <span id="standaloneTitle">بازی</span>
  </div>
  <iframe id="standaloneFrame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="supabase-config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>
<script src="settings.js"></script>
<script src="shop.js"></script>
<script src="online.js"></script>
<script>
// Telegram Mini App bootstrap + light protection
(function(){
  try {
    if (window.Telegram && Telegram.WebApp) {
      const tg = Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
      // Match theme
      const scheme = tg.colorScheme || 'dark';
      document.documentElement.setAttribute('data-theme', scheme === 'light' ? 'light' : 'dark');
      if (tg.themeParams?.bg_color) {
        document.querySelector('meta[name=theme-color]')?.setAttribute('content', tg.themeParams.bg_color);
      }
    }
  } catch(e){}

  // Basic anti-theft (not perfect, but raises the bar)
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u')) {
      e.preventDefault();
    }
  });
  // Disable drag
  document.addEventListener('dragstart', e => e.preventDefault());

  App.init();
})();
</script>
</body>
</html>
